
name: GitHub Demo Build

run-name: GitHub Demo Build ($&#123;&#123; inputs.portal_dispatch_id &#125;&#125;)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      portal_dispatch_id:
        description: Portal dispatch correlation
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MyMvcLandingPage.csproj

      - name: Build
        run: dotnet build MyMvcLandingPage.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish MyMvcLandingPage.csproj --configuration Release --no-build --output "${{ github.workspace }}/publish"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-demo-build
          path: publish/
          if-no-files-found: error
